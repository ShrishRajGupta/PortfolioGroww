spring:
  profiles:
    # Local runs behave like dev unless SPRING_PROFILES_ACTIVE says otherwise.
    # Deployments must set SPRING_PROFILES_ACTIVE=prod.
    default: dev

  datasource:
    # MYSQL_DATABASE is what the Dockerfile/compose already set; MYSQL_DB is the shorter alias.
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:${MYSQL_DATABASE:mydb}}
    username: ${MYSQL_USER:user}
    password: ${MYSQL_PASSWORD:userpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
      pool-name: portfolio-hikari

  jpa:
    # Schema is owned by Flyway; Hibernate only checks the mapping matches.
    hibernate:
      ddl-auto: validate
    # Don't hold a DB connection open for the whole request/response cycle.
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Databases created earlier by ddl-auto have no history table: adopt V1 as applied.
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    # Accept the compose/k8s variable name as well as the conventional one.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_ADVERTISED_LISTENERS:localhost:9092}}
    producer:
      # Outbox payloads are already JSON text; the relay publishes them as-is.
      acks: all
      properties:
        # send() blocks on metadata for this long when the broker is unreachable; keep it short so a
        # down broker costs the relay seconds per tick, not the 60s client default.
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

app:
  kafka:
    # The TradeExecuted consumer is a downstream subscriber; keep it off where no broker runs.
    consumer-enabled: ${KAFKA_CONSUMER_ENABLED:false}
    consumer-group: ${KAFKA_CONSUMER_GROUP:portfolio-events}
    topics:
      trade-executed: ${KAFKA_TOPIC_TRADE_EXECUTED:trade-executed}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}
  outbox:
    # Trades write an outbox row in their own transaction; the relay publishes pending rows to Kafka.
    # Delivery is at-least-once; consumers deduplicate on eventId. The dev profile turns the relay off.
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-ms: ${OUTBOX_POLL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:5000}
  trade:
    # Positions are updated with optimistic locking; concurrent trades on the same position retry.
    max-attempts: ${TRADE_MAX_ATTEMPTS:5}
    retry-backoff-ms: ${TRADE_RETRY_BACKOFF_MS:20}
  # Published Google Sheet (CSV) that feeds the scheduled stock-price refresh.
  stock-sheet-url: ${STOCK_SHEET_URL:https://docs.google.com/spreadsheets/d/e/2PACX-1vTVvpOPIz0e1k3fAbExvEpo2XMGmVkhXPkUxnIEr4BVQayT2--uuxoqhc6yKBd7S_WG4SQOdJLEboqs/pub?gid=49957058&single=true&output=csv}
  # Daily at 01:00.
  stock-price-cron: ${STOCK_PRICE_CRON:0 0 1 * * ?}
